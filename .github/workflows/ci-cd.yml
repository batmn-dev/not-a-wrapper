name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least-privilege token; the deploy job authenticates via CONVEX_DEPLOY_KEY,
# so nothing here needs write access.
permissions:
  contents: read

# Cancel superseded PR runs; pushes to main queue so deploys are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript checks
        run: bun run typecheck

      # Offline + deterministic: regenerates from the committed snapshot +
      # allowlist and fails on drift (including hand-edits to the generated
      # file). No network access.
      - name: Verify generated OpenRouter catalog is in sync
        run: bun run catalog:openrouter:check

      - name: Run Convex schema deploy contract tests
        run: bunx vitest run scripts/convex-schema-contract-lib.test.mjs

      - name: Dry-run Convex schema preflight script
        run: node scripts/convex-schema-contract-preflight.mjs --fetch-base --require-diff-base --dry-run

      - name: Verify schema preflight fails closed without diff base
        run: |
          if node scripts/convex-schema-contract-preflight.mjs --base refs/remotes/schema-guard/missing-${{ github.run_id }} --require-diff-base --dry-run; then
            echo "Expected schema preflight to fail when the required diff base cannot be read"
            exit 1
          fi

      - name: Run all tests
        run: bun run test

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # CI build - validates Next.js compiles (no Convex deployment)
      - name: Build application
        run: bun run build:next
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}

  # Deploy to Convex on main branch merges
  deploy:
    name: Deploy to Convex
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    concurrency:
      group: convex-deploy
      cancel-in-progress: false
    env:
      VERCEL_PROJECT_PRODUCTION_URL: ${{ vars.VERCEL_PROJECT_PRODUCTION_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production deploy configuration
        run: |
          if [ -z "${VERCEL_PROJECT_PRODUCTION_URL:-}" ]; then
            echo "::error title=Missing VERCEL_PROJECT_PRODUCTION_URL::Set the GitHub Actions repository variable VERCEL_PROJECT_PRODUCTION_URL to the production host, without https://."
            exit 1
          fi

          if [[ "$VERCEL_PROJECT_PRODUCTION_URL" == http://* || "$VERCEL_PROJECT_PRODUCTION_URL" == https://* || "$VERCEL_PROJECT_PRODUCTION_URL" == */* ]]; then
            echo "::error title=Invalid VERCEL_PROJECT_PRODUCTION_URL::Use only the production host, for example example.com. convex.json adds https:// and /callback."
            exit 1
          fi

      - name: Deploy to Convex
        run: bun run convex:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
